<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thodu Licence - Scanner</title>
    <script src="https://unpkg.com/tesseract.js@v2.1.0/dist/tesseract.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
    
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f0f2f5; margin: 0; padding: 20px; color: #333; }
        .card { max-width: 700px; margin: auto; background: white; padding: 40px; border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.1); border-top: 8px solid #2c3e50; }
        h1 { color: #2c3e50; text-align: center; margin-bottom: 5px; }
        p.subtitle { text-align: center; color: #7f8c8d; margin-bottom: 30px; }
        .upload-area { border: 3px dashed #3498db; padding: 40px; text-align: center; border-radius: 10px; cursor: pointer; transition: 0.3s; background: #f9f9f9; }
        .upload-area:hover { background: #ebf5fb; border-color: #2980b9; }
        #status { text-align: center; margin: 20px 0; font-weight: bold; color: #2980b9; }
        .editor { display: none; flex-direction: column; gap: 15px; }
        textarea { width: 100%; height: 200px; padding: 15px; border: 1px solid #ccc; border-radius: 8px; font-size: 14px; box-sizing: border-box; }
        .btn { background: #27ae60; color: white; border: none; padding: 15px; border-radius: 8px; cursor: pointer; font-size: 18px; font-weight: bold; transition: 0.2s; }
        .btn:hover { background: #219150; transform: translateY(-2px); }
        .loader { border: 4px solid #f3f3f3; border-top: 4px solid #3498db; border-radius: 50%; width: 30px; height: 30px; animation: spin 1s linear infinite; display: inline-block; vertical-align: middle; margin-right: 10px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

<div class="card">
    <h1>THODU LICENCE</h1>
    <p class="subtitle">Official Document OCR & Generator</p>

    <div class="upload-area" id="dropZone" onclick="document.getElementById('fileInput').click()">
        <p><strong>Step 1:</strong> Click to Scan/Upload Document</p>
        <input type="file" id="fileInput" hidden accept="image/*">
    </div>

    <div id="status">Waiting for input...</div>

    <div class="editor" id="editorSection">
        <label><strong>Step 2:</strong> Review & Edit Extracted Details:</label>
        <textarea id="outputField"></textarea>
        <button class="btn" onclick="generatePDF()">Step 3: Generate Custom Thodu Licence</button>
    </div>
</div>

<script>
    const fileInput = document.getElementById('fileInput');
    const status = document.getElementById('status');
    const editor = document.getElementById('editorSection');
    const outputField = document.getElementById('outputField');

    fileInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        // Visual Feedback
        status.innerHTML = '<div class="loader"></div>Scanning Document with AI...';
        editor.style.display = 'none';

        try {
            // Using Tesseract to extract text
            const worker = Tesseract.createWorker();
            await worker.load();
            await worker.loadLanguage('eng');
            await worker.initialize('eng');
            
            const { data: { text } } = await worker.recognize(file);
            
            outputField.value = text.trim() || "No text detected. Please try a clearer image.";
            status.innerHTML = "✅ Scan Success!";
            editor.style.display = 'flex';
            
            await worker.terminate();
        } catch (err) {
            status.innerHTML = "❌ Error: Could not read document.";
            console.error(err);
        }
    });

    function generatePDF() {
        try {
            // Fix for jsPDF initialization
            const { jsPDF } = window.jspdf;
            const doc = new jsPDF();
            const textContent = outputField.value;

            // Header Section
            doc.setFillColor(44, 62, 80);
            doc.rect(0, 0, 210, 40, 'F');
            
            doc.setTextColor(255, 255, 255);
            doc.setFontSize(24);
            doc.text("THODU LICENCE", 105, 25, { align: "center" });

            // Body Section
            doc.setTextColor(0, 0, 0);
            doc.setFontSize(14);
            doc.text("OFFICIAL RECORD DETAILS:", 20, 55);
            
            doc.setLineWidth(0.5);
            doc.line(20, 58, 80, 58);

            // Clean up text and wrap it
            doc.setFontSize(11);
            const wrappedText = doc.splitTextToSize(textContent, 170);
            doc.text(wrappedText, 20, 70);

            // Footer / Date
            const today = new Date().toLocaleDateString();
            doc.setFontSize(10);
            doc.setTextColor(150, 150, 150);
            doc.text(`Generated via Thodu Licence System on: ${today}`, 105, 285, { align: "center" });

            // Trigger Download
            doc.save("Thodu_Licence_Custom.pdf");
            status.innerHTML = "✅ Document Generated Successfully!";
        } catch (err) {
            alert("Error generating PDF: " + err.message);
        }
    }
</script>

</body>
  </html>
