<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thodu Licence - Card Creator</title>
    <script src="https://unpkg.com/tesseract.js@v2.1.0/dist/tesseract.min.js"></script>
    <style>
        body { font-family: sans-serif; background: #2c3e50; color: white; text-align: center; padding: 20px; }
        .container { max-width: 800px; margin: auto; background: #ecf0f1; padding: 20px; border-radius: 15px; color: #333; }
        #licenceCanvas { border-radius: 15px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); max-width: 100%; height: auto; margin-top: 20px; display: none;}
        .controls { margin: 20px 0; padding: 20px; border: 2px dashed #bdc3c7; }
        button { background: #e67e22; color: white; border: none; padding: 10px 20px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .status { color: #2980b9; font-weight: bold; margin: 10px; }
        #editFields { display: none; grid-template-columns: 1fr 1fr; gap: 10px; text-align: left; margin-top: 20px; }
        input { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
    </style>
</head>
<body>

<div class="container">
    <h1>THODU LICENCE GENERATOR</h1>
    <p>Upload a scan to auto-fill your custom card</p>

    <div class="controls">
        <input type="file" id="fileInput" accept="image/*">
        <div id="status" class="status">Ready to scan...</div>
    </div>

    <div id="editFields">
        <label>Name: <input type="text" id="field_name" value="NAME SURNAME"></label>
        <label>DL No: <input type="text" id="field_dl" value="MH12 20230000"></label>
        <label>Address: <input type="text" id="field_add" value="YOUR ADDRESS HERE"></label>
        <label>DOB: <input type="text" id="field_dob" value="DD-MM-YYYY"></label>
        <button onclick="drawLicence()" style="grid-column: span 2; background: #27ae60;">Update Card Preview</button>
    </div>

    <canvas id="licenceCanvas" width="1000" height="630"></canvas>
    <br>
    <button id="downloadBtn" style="display:none; margin-top: 10px;" onclick="downloadCard()">Download Card Image</button>
</div>

<script>
    const fileInput = document.getElementById('fileInput');
    const status = document.getElementById('status');
    const canvas = document.getElementById('licenceCanvas');
    const ctx = canvas.getContext('2d');

    fileInput.addEventListener('change', async (e) => {
        const file = e.target.files[0];
        if (!file) return;

        status.innerText = "⏳ Reading Document... Please wait.";
        
        const worker = Tesseract.createWorker();
        await worker.load();
        await worker.loadLanguage('eng');
        await worker.initialize('eng');
        const { data: { text } } = await worker.recognize(file);
        
        // Simple logic to try and find data in the text
        const lines = text.split('\n');
        document.getElementById('field_name').value = lines[0] || "Extracted Name";
        document.getElementById('field_dl').value = text.match(/[A-Z]{2}\d{2,13}/) || "MH12 000000";

        status.innerText = "✅ Scan Complete! Adjust details below.";
        document.getElementById('editFields').style.display = 'grid';
        drawLicence();
        await worker.terminate();
    });

    function drawLicence() {
        // 1. Background
        ctx.fillStyle = "#fffcf2";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        // 2. Header Bar
        ctx.fillStyle = "#c0392b";
        ctx.fillRect(150, 40, 700, 60);
        
        ctx.fillStyle = "white";
        ctx.font = "bold 24px Arial";
        ctx.textAlign = "center";
        ctx.fillText("THE UNION OF INDIA", 500, 65);
        ctx.font = "bold 28px Arial";
        ctx.fillText("THODU STATE MOTOR DRIVING LICENCE", 500, 93);

        // 3. Labels
        ctx.textAlign = "left";
        ctx.fillStyle = "#333";
        ctx.font = "bold 22px Arial";
        
        const name = document.getElementById('field_name').value;
        const dl = document.getElementById('field_dl').value;
        const addr = document.getElementById('field_add').value;
        const dob = document.getElementById('field_dob').value;

        ctx.fillText("DL No: " + dl, 200, 150);
        ctx.fillText("Name  : " + name, 130, 450);
        ctx.fillText("Add    : " + addr, 130, 490);
        ctx.fillText("DOB   : " + dob, 350, 400);

        // 4. Chip and Photo Box
        ctx.fillStyle = "#f39c12"; // Gold chip
        ctx.fillRect(150, 250, 100, 80);
        
        ctx.strokeStyle = "#2980b9";
        ctx.lineWidth = 2;
        ctx.strokeRect(750, 220, 180, 220); // Photo box
        ctx.fillStyle = "#bdc3c7";
        ctx.fillRect(751, 221, 178, 218);
        ctx.fillStyle = "#fff";
        ctx.fillText("PHOTO", 800, 330);

        // Show UI
        canvas.style.display = "block";
        document.getElementById('downloadBtn').style.display = "inline-block";
    }

    function downloadCard() {
        const link = document.createElement('a');
        link.download = 'Thodu_Licence_Card.png';
        link.href = canvas.toDataURL();
        link.click();
    }
</script>

</body>
</html>
